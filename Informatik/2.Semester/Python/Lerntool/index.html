<script type="text/python" id="harness">import sys, io, os, re, json, math, string, shutil, importlib, traceback

WORK = globals().get("WORK_DIR", "/work")
USER_MARK = "<dein Code>"

# ---------------------------------------------------------------- Dateien
def _ref_parse(text):
    lines = [l for l in text.strip().splitlines() if l.strip()]
    names, heights = [], []
    for line in lines[1:]:
        n, h = line.split(",")
        names.append(n.strip()); heights.append(float(h))
    return names, heights

def _swap(text):
    out = []
    for line in text.strip().splitlines():
        if line.strip():
            n, h = line.split(",")
            out.append(f"{h.strip()},{n.strip()}")
    return "\n".join(out) + "\n"

FILES = dict(CSV_FILES)
FILES["personen_vertauscht.csv"] = _swap(FILES["personen.csv"])
NAMES, HEIGHTS = _ref_parse(FILES["personen.csv"])
NAMES_K, HEIGHTS_K = _ref_parse(FILES["personen_kurz.csv"])

REF_READ = '''import csv

def reset_env():
    os.makedirs(WORK, exist_ok=True)
    os.chdir(WORK)
    if WORK not in sys.path:
        sys.path.insert(0, WORK)
    for name in list(sys.modules):

def write_package(files):

    for rel, content in files.items():
        with open(os.path.join(WORK, rel), "w", encoding="utf-8") as f:

    importlib.invalidate_caches()

# ---------------------------------------------------------------- Ausführen
def _is_user_frame(fn):
    return fn == USER_MARK or fn.startswith(os.path.join(WORK, "height"))

def fmt_exc(e):
    if isinstance(e, SyntaxError) and (e.filename == USER_MARK or _is_user_frame(e.filename or "")):
        where = "" if e.filename == USER_MARK else os.path.basename(e.filename) + ", "
        return f"{where}Zeile {e.lineno}: SyntaxError: {e.msg}"
    frames = [f for f in traceback.extract_tb(e.__traceback__) if _is_user_frame(f.filename)]
    head = "".join(traceback.format_exception_only(type(e), e)).strip()
    if frames:
        f = frames[-1]
        where = "" if f.filename == USER_MARK else os.path.basename(f.filename) + ", "
        return f"{where}Zeile {f.lineno}: {head}"
    return head

class Captured:
    def __init__(self):
        self.buf = io.StringIO()
    def __enter__(self):
        self.old = sys.stdout, sys.stderr, sys.stdin
        sys.stdout = sys.stderr = self.buf
        sys.stdin = io.StringIO("")
        return self
    def __exit__(self, *a):
        sys.stdout, sys.stderr, sys.stdin = self.old
        return False

def execute(code, env=None):
    g = {"__name__": "__main__"}
    if env:
        g.update(env)
    exc = None
    with Captured() as cap:
        try:
            exec(compile(code, USER_MARK, "exec"), g)
        except BaseException as e:
            exc = e
    return g, cap.buf.getvalue(), exc

def call(f, *args):
    """Ruft eine Funktion des Nutzers auf -> (wert, exception, ausgabe)."""
    with Captured() as cap:
        try:
            return f(*args), None, cap.buf.getvalue()
        except BaseException as e:
            return None, e, cap.buf.getvalue()

def approx(x, y, tol=1e-6):
    try:
        return math.isclose(float(x), float(y), rel_tol=tol, abs_tol=tol)
    except (TypeError, ValueError):
        return False

def num_list_eq(a, b):
    return isinstance(a, (list, tuple)) and len(a) == len(b) and all(
        isinstance(x, (int, float)) and not isinstance(x, bool) and approx(x, y) for x, y in zip(a, b))

def show(v, n=70):
    s = repr(v)
    return s if len(s) <= n else s[:n] + " …"

# ---------------------------------------------------------------- Bewertung
class Grade:
    def __init__(self):
        self.checks = []
        self.output = ""
        self.error = None
    def check(self, cond, ok, bad=None):
        cond = bool(cond)
        self.checks.append({"ok": cond, "msg": ok if cond else (bad or ok)})
        return cond
    def fail(self, msg):
        return self.check(False, msg)
    def note(self, msg):
        self.checks.append({"ok": None, "msg": msg})
    def run(self, code, env=None, label=None):
        g, out, exc = execute(code, env)
        prefix = f"[{label}]\n" if label else ""
        if out or label:
            self.output += prefix + out
        if exc is not None and self.error is None:
            self.error = (f"[{label}] " if label else "") + fmt_exc(exc)
        return g, out, exc
    def need(self, g, name, kind="var"):
        if name not in g:
            return self.fail(f"`{name}` ist nicht definiert.")
        if kind == "func" and not callable(g[name]):
            return self.fail(f"`{name}` ist keine Funktion.")
        if kind == "class" and not isinstance(g[name], type):
            return self.fail(f"`{name}` ist keine Klasse.")
        return True
    def result(self):
        hard = [c for c in self.checks if c["ok"] is not None]
        return {"passed": bool(hard) and all(c["ok"] for c in hard),
                "checks": self.checks, "output": self.output, "error": self.error}

TASKS = {}
def task(tid):
    def deco(f):
        TASKS[tid] = f
        return f
    return deco

def crashed(G, exc):
    if exc is not None:
        G.fail("Dein Code bricht mit einem Fehler ab (siehe unten).")
        return True
    return False

L_REF = list(range(100, 2301, 200))
D_REF = dict(zip(string.ascii_uppercase[3:], L_REF))

# ======================= Aufgabe 1 =======================
@task("1.1")
def t11(code, G):
    g, out, exc = G.run(code)
    if crashed(G, exc) or not G.need(g, "L"):
        return
    L = g["L"]
    G.check(isinstance(L, list), "`L` ist eine Liste.", f"`L` ist keine Liste, sondern {type(L).__name__}. Tipp: list(range(...)).")
    G.check(list(L) == L_REF if isinstance(L, (list, tuple, range)) else False,
            "`L` enthält genau 100, 300, …, 2300.",
            f"`L` ist {show(L)} – erwartet [100, 300, …, 2300] (12 Elemente, stop ist exklusiv).")

@task("1.2")
def t12(code, G):
    g, out, exc = G.run(code, {"L": list(L_REF)})
    if crashed(G, exc):
        return
    rev = str(L_REF[::-1])
    hits = sum(1 for line in out.splitlines() if line.strip() == rev)
    techniques = [
        (r"\[\s*:\s*:\s*-\s*1\s*\]", "Slicing [::-1]"),
        (r"\breversed\s*\(", "reversed()"),
        (r"\bsorted\s*\([^)]*reverse\s*=\s*True", "sorted(..., reverse=True)"),
        (r"\.reverse\s*\(\s*\)", ".reverse()"),
        (r"\brange\s*\([^)]*-\s*\d+\s*\)", "range mit negativer Schrittweite"),
        (r"\.insert\s*\(\s*0", "insert(0, ...)"),
    ]
    found = [name for pat, name in techniques if re.search(pat, code)]
    if G.check(hits >= 1, f"{hits} korrekte Ausgabe(n) der umgekehrten Liste.",
               "Keine Ausgabezeile entspricht der umgekehrten Liste. Achtung: print(reversed(L)) zeigt nur ein Iterator-Objekt, print(L.reverse()) zeigt None."):
        if re.search(r"sorted\s*\([^)]*reversed\s*=", code):
            G.note("`sorted(..., reversed=True)` ist falsch – der Parameter heißt `reverse`.")
        G.note("Erkannte Methoden: " + (", ".join(found) if found else "keine bekannte") +
               (" – jede weitere Art bringt einen Zusatzpunkt." if len(found) < 3 else ""))

@task("1.3")
def t13(code, G):
    g, out, exc = G.run(code, {"L": list(L_REF)})
    if crashed(G, exc) or not G.need(g, "d"):
        return
    d = g["d"]
    if not G.check(isinstance(d, dict), "`d` ist ein Dictionary.", f"`d` ist kein Dict, sondern {type(d).__name__}."):
        return
    if d == D_REF:
        G.check(True, "`d` = {'D': 100, 'E': 300, …, 'O': 2300}.")
    else:
        if isinstance(d, dict) and {k: str(v) for k, v in D_REF.items()} == d:
            G.fail("Die Werte sind Strings – sie sollen die Zahlen aus L sein.")
        else:
            G.fail(f"`d` ist {show(d)} – erwartet {{'D': 100, 'E': 300, …, 'O': 2300}}.")

def _sets(code, G, mode):
    g, out, exc = G.run(code)
    if crashed(G, exc):
        return
    for n in ("s1", "s2", "schnitt", "diff_12", "diff_21", "vereinigung"):
        if not G.need(g, n):
            return
    s1, s2 = g["s1"], g["s2"]
    if not G.check(isinstance(s1, set) and isinstance(s2, set), "`s1` und `s2` sind Sets.", "`s1` und `s2` müssen Sets sein."):
        return
    G.check(s1 & s2 and s1 != s2, "Die Sets unterscheiden sich und haben gemeinsame Elemente.",
            "Die Sets sollen verschieden sein und einige gemeinsame Elemente haben.")
    for n, exp in (("schnitt", s1 & s2), ("diff_12", s1 - s2), ("diff_21", s2 - s1), ("vereinigung", s1 | s2)):
        G.check(g[n] == exp, f"`{n}` = {show(exp)}", f"`{n}` ist {show(g[n])}, erwartet {show(exp)}.")
    if mode == "method":
        for m in ("intersection", "difference", "union"):
            G.check(re.search(r"\." + m + r"\s*\(", code), f"Methode `.{m}()` verwendet.", f"Methode `.{m}()` fehlt.")
    else:
        used_methods = [m for m in ("intersection", "difference", "union") if re.search(r"\." + m + r"\s*\(", code)]
        G.check(not used_methods, "Keine Set-Methoden verwendet.", "Hier bitte Operatoren statt " + ", ".join(f".{m}()" for m in used_methods) + ".")
        for op, name in (("&", "Schnittmenge"), ("-", "Differenz"), ("|", "Vereinigung")):
            G.check(op in code, f"Operator `{op}` für die {name} verwendet.", f"Operator `{op}` für die {name} fehlt.")

@task("1.4")
def t14(code, G): _sets(code, G, "method")

@task("1.5")
def t15(code, G): _sets(code, G, "op")

def t17(code, G):

@task("1.8")
def t18(code, G):

@task("1.9")
def t19(code, G):
    g, out, exc = G.run(code, {"a": 100, "b": 2.57878})
    if crashed(G, exc):
        return
    if re.search(r"2\.57878|0000100|2\.58", code):
        G.fail("Die Zahlen bitte aus `a` und `b` formatieren, nicht als festen Text schreiben.")
    lines = out.split("\n")
    expected = [("100 2.57878",), ("100 2.57878 100",), (" 2.58", "' 2.58'"), ("0000100",), ("200",)]
    for i, exp in enumerate(expected):
        got = lines[i].rstrip() if i < len(lines) else None
        G.check(got in exp, f"Zeile {i+1}: {exp[0]!r}",
                f"Zeile {i+1}: erwartet {exp[0]!r}, bekommen " + ("keine Ausgabe." if not got else f"{got!r}."))

# ======================= Aufgabe 2 =======================
def _read_check(G, f, fn, names, heights):
    res, exc, _ = call(f, fn)
    if exc is not None:
        return G.fail(f"read_csv_file({fn!r}) → Fehler: {fmt_exc(exc)}")
    if isinstance(res, dict):
        return G.fail(f"read_csv_file({fn!r}) gibt ein Dict zurück – `names, heights = …` entpackt dann nur die Keys.")
    if not (isinstance(res, (tuple, list)) and len(res) == 2):
        return G.fail(f"read_csv_file({fn!r}) soll zwei Listen zurückgeben, bekommen: {show(res)}")
    n, h = res
    ok_n = isinstance(n, list) and [str(x).strip() for x in n] == names
    ok_h = num_list_eq(h, heights)
    if ok_n and ok_h:
        return G.check(True, f"{fn}: {len(names)} Namen und Größen korrekt.")
    if not ok_n:
        G.fail(f"{fn}: Namen sind {show(n)}, erwartet {show(names)}.")
    if not ok_h:
        hint = " (Größen müssen Zahlen sein, nicht Strings)" if isinstance(h, list) and h and isinstance(h[0], str) else ""
        G.fail(f"{fn}: Größen sind {show(h)}, erwartet {show(heights)}{hint}.")
    return False

@task("2.1")
def t21(code, G):
    g, out, exc = G.run(code)
    if crashed(G, exc) or not G.need(g, "read_csv_file", "func"):
        return

    text:"Speichere den Wert zum Key `k` in `wert`. Existiert der Key nicht, soll ein `ValueError` geworfen werden – kein `KeyError`. Gefragt ist eine Zeile; eine kleine Hilfsfunktion darfst du davor definieren.",
    given:"d = {'D': 100, 'E': 300, …, 'O': 2300}\nk = 'E'   # dein Code läuft einmal mit k = 'E' und einmal mit k = 'Z'" },
  { id:"1.9", part:1, title:"Ausgabe formatieren",
    text:"Gib mit f-Strings nacheinander die fünf Zeilen unten aus. Die dritte Zeile beginnt mit einem Leerzeichen (im Protokoll als `' 2.58'` notiert).",
    given:"a = 100\nb = 2.57878", expect:"100 2.57878\n100 2.57878 100\n 2.58\n0000100\n200" },

  { id:"2.1", part:2, title:"CSV einlesen",
    text:"Schreibe `read_csv_file(filename)`. Die Funktion liest die CSV-Datei ein und gibt zwei Listen zurück: die Namen und die Größen als Zahlen. `names, heights = read_csv_file(\"personen.csv\")` muss funktionieren – ebenso mit `personen_kurz.csv`.",
    given:"Dateien im Arbeitsordner: personen.csv, personen_kurz.csv\n\nName,Größe\nAnna,168.5\nBen,182.0\n…" },
  { id:"2.2", part:2, title:"Spalten vertauscht",
    text:"Schreibe `read_csv_file(filename)` so, dass sie auch funktioniert, wenn die Spalten vertauscht sind. Getestet wird mit `personen.csv`, `personen_kurz.csv` und `personen_vertauscht.csv`.",
    given:"personen_vertauscht.csv:\nGröße,Name\n168.5,Anna\n182.0,Ben\n…" },
  { id:"2.3", part:2, title:"Rückgabe als Dictionary",
    text:"Schreibe `read_csv_dict(filename)`, die Namen und Größen als Dictionary zurückgibt – entweder `{Name: Größe}` oder `{Spalte: Liste der Werte}`.",
    given:"Dateien im Arbeitsordner: personen.csv, personen_kurz.csv" },
  { id:"2.4", part:2, title:"Mittelwert",
    text:"Schreibe `mean(heights)`, die den Mittelwert aller Größen zurückgibt.",
    given:"names   = ['Anna', 'Ben', 'Clara', …]   # aus personen.csv\nheights = [168.5, 182.0, 175.3, …]" },
  { id:"2.5", part:2, title:"Kleinste Person",
    text:"Schreibe `shortest_person(names, heights)`, die Name und Größe der kleinsten Person zurückgibt.",
    given:"names   = ['Anna', 'Ben', 'Clara', …]\nheights = [168.5, 182.0, 175.3, …]" },
  { id:"2.6", part:2, title:"Größte Person",
    text:"Schreibe `tallest_person(names, heights)`, die Name und Größe der größten Person zurückgibt.",
    given:"names   = ['Anna', 'Ben', 'Clara', …]\nheights = [168.5, 182.0, 175.3, …]" },
  { id:"2.7", part:2, title:"min oder max als Parameter",
    text:"Schreibe `min_max_person(names, heights, func)`. Übergeben wird die Funktion `min` oder `max` selbst (kein String). So ermittelt dieselbe Funktion die kleinste oder die größte Person.",
    given:"names   = ['Anna', 'Ben', 'Clara', …]\nheights = [168.5, 182.0, 175.3, …]" },
  { id:"2.8", part:2, title:"Mehrere gleich große Personen",
    text:"Schreibe `min_max_persons(names, heights, func)`. Haben mehrere Personen dieselbe minimale bzw. maximale Größe, gibt die Funktion alle ihre Namen als Liste zurück.",
    given:"names   = ['Anna', 'Ben', 'Clara', …]\nheights = [168.5, 182.0, 175.3, …]   # David und Jonas: 190.2" },

  { id:"3.1", part:3, title:"Klasse Person",
    text:"Erstelle die Klasse `Person` mit den Attributen `name` und `height` und der Methode `grow(amount)`, die `height` um `amount` erhöht." },
  { id:"3.2", part:3, title:"Klasse BesserePerson",
    text:"Erstelle `BesserePerson`, die von `Person` erbt. `grow(amount)` prüft, ob `amount` größer als 0 und kleiner als 10 ist – sonst wird ein `ValueError` geworfen.",
    given:"class Person:   # mit __init__(self, name, height) und grow(self, amount)" },
  { id:"3.3", part:3, title:"Dictionary persons",
    text:"Erstelle das Dictionary `persons`: Keys sind die Namen aus `names`, Werte die passenden `Person`-Instanzen.",
    given:"class Person   # wie in 3.1\nnames   = ['Anna', 'Ben', 'Clara', …]\nheights = [168.5, 182.0, 175.3, …]" },
  { id:"3.4", part:3, title:"__repr__",
    text:"Schreibe die Klasse `Person` mit einer `__repr__`-Methode, sodass `print(Person(\"Anna\", 168.5))` die Ausgabe `Person(Anna, 168.5)` erzeugt." },
  { id:"3.5", part:3, title:"__repr__ mit Klassenname",
    text:"Schreibe `Person` und `BesserePerson` so, dass `print(BesserePerson(\"Max\", 180))` automatisch `BesserePerson(Max, 180)` ausgibt – ohne `__repr__` in `BesserePerson` zu definieren." },

  { id:"4.1", part:4, title:"Package anlegen",
    text:"Lege das Paket `height` an: `read.py` enthält `read_csv_file`, `calc.py` enthält `mean`, `shortest_person` und `tallest_person`. Danach muss der Code unten funktionieren.",
    given:"from height.read import read_csv_file\nnames, heights = read_csv_file(\"personen.csv\")\nfrom height.calc import mean\nmean(heights)",
    files:["height/__init__.py", "height/read.py", "height/calc.py"] },
  { id:"4.2", part:4, title:"Import unter anderem Namen",
    text:"Das Paket `height` ist vorhanden. Importiere das Modul `calc` unter dem Namen `rechner` und die Funktion `read_csv_file` unter dem Namen `lesen`. Speichere dann `ergebnis = rechner.mean(lesen(\"personen.csv\")[1])`.",
    given:"height/\n├── __init__.py\n├── read.py   # read_csv_file\n└── calc.py   # mean, shortest_person, tallest_person" }
];
const PARTS = {1:"Listen, Dict, Sets & Formatierung", 2:"CSV einlesen & auswerten", 3:"Klassen & Vererbung", 4:"Package"};


const PYODIDE_URLS = [
  "https://cdn.jsdelivr.net/pyodide/v0.29.3/full/",
  "https://cdn.jsdelivr.net/npm/pyodide@0.29.3/"
];
const TIMEOUT_MS = 8000;
const STORE_KEY = "python-pruefung-uebung-v1";
const SOLUTIONS = JSON.parse(document.getElementById("solutions").textContent);
const CSV_FILES = JSON.parse(document.getElementById("csvdata").textContent);
const HARNESS = document.getElementById("harness").textContent;

/* ---------------- Python-Laufzeit (Web Worker, damit Endlosschleifen abbrechbar sind) ---------------- */
const WORKER_SRC = `
let py = null;
self.onmessage = async (e) => {
  const m = e.data;
  if (m.type === "init") {
    let lastErr = null;
    for (const url of m.urls) {
      try {
        importScripts(url + "pyodide.js");
        py = await loadPyodide({ indexURL: url });
        break;
      } catch (err) { lastErr = err; py = null; }
    }
    if (!py) { postMessage({ type: "init-error", error: String(lastErr) }); return; }
    try {
      py.globals.set("CSV_FILES", py.toPy(m.files));
      py.runPython(m.harness);
      postMessage({ type: "ready" });
    } catch (err) { postMessage({ type: "init-error", error: String(err) }); }
  } else if (m.type === "grade") {
    try {
      py.globals.set("_payload", JSON.stringify(m.payload));
      const res = py.runPython("grade_json(_payload)");
      postMessage({ type: "result", id: m.id, result: JSON.parse(res) });
    } catch (err) {
      postMessage({ type: "result", id: m.id, result: { passed: false, checks: [{ ok: false, msg: "Interner Fehler: " + err }], output: "", error: null } });
    }
  }
};`;

const runtime = {
  worker: null, ready: false, pending: null, seq: 0,
  start() {
    this.ready = false;
    setStatus("load");
    let w;
    try {
      w = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" })));
    } catch (err) {
      setStatus("err", "Web Worker nicht verfügbar: " + err.message);
      return;
    }
    this.worker = w;
    w.onmessage = (e) => this.onMessage(e.data);
    w.onerror = (e) => setStatus("err", "Python konnte nicht starten (" + (e.message || "Worker-Fehler") + ")");
    w.postMessage({ type: "init", urls: PYODIDE_URLS, files: CSV_FILES, harness: HARNESS });
  },
  onMessage(m) {
    if (m.type === "ready") { this.ready = true; setStatus("ready"); const b = document.getElementById("check"); if (b) b.disabled = false; }
    else if (m.type === "init-error") { setStatus("err", "Python konnte nicht geladen werden – Internetverbindung prüfen. (" + m.error + ")"); }
    else if (m.type === "result" && this.pending && this.pending.id === m.id) {
      clearTimeout(this.pending.timer);
      const done = this.pending.resolve; this.pending = null;
      done(m.result);
    }
  },
  grade(task, code) {
    return new Promise((resolve) => {
      const id = ++this.seq;
      const timer = setTimeout(() => {
        this.pending = null;
        this.worker.terminate();
        resolve({ passed: false, checks: [{ ok: false, msg: `Zeitlimit von ${TIMEOUT_MS / 1000} s überschritten – vermutlich eine Endlosschleife. Python wird neu gestartet.` }], output: "", error: null });
        this.start();
      }, TIMEOUT_MS);
      this.pending = { id, resolve, timer };
      this.worker.postMessage({ type: "grade", id, payload: { task, code } });
    });
  }
};

function setStatus(kind, text) {
  const el = document.getElementById("status");
  el.className = "status" + (kind === "ready" ? " ready" : kind === "err" ? " err" : "");
  el.querySelector("span").textContent = text || (kind === "ready" ? "Python bereit" : "Python wird geladen …");
}

/* ---------------- Zustand ---------------- */
let state = { cur: 0, view: "task", answers: {} };
try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && s.answers) state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
function ans(t) {
  if (!state.answers[t.id]) state.answers[t.id] = { code: t.files ? Object.fromEntries(t.files.map(f => [f, ""])) : "", status: "open", tries: 0, peeked: false, last: null };
  return state.answers[t.id];
}

/* ---------------- Darstellung ---------------- */
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const md = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");

function renderMap() {
  const map = document.getElementById("map");
  let html = "";
  for (const p of [1, 2, 3, 4]) {
    html += `<div class="grp"><b>A${p}</b>`;
    TASKS.forEach((t, i) => {
      if (t.part !== p) return;
      const a = ans(t);
      const cls = ["dot", a.status, state.view === "task" && i === state.cur ? "cur" : ""].join(" ");
      html += `<button class="${cls}" data-go="${i}" title="${esc(t.id + " " + t.title)}">${t.id.split(".")[1]}</button>`;
    });
    html += `</div>`;
  }
  html += `<button class="reportbtn" data-report="1">Auswertung</button>`;
  map.innerHTML = html;
}

function resultHTML(r) {
  if (!r) return "";
  const items = r.checks.map(c => `<li class="${c.ok === true ? "y" : c.ok === false ? "n" : "i"}">${md(c.msg)}</li>`).join("");
  let extra = "";
  if (r.error) extra += `<span class="lbl">Fehler</span><pre>${esc(r.error)}</pre>`;
  if (r.output && r.output.trim()) extra += `<span class="lbl">Ausgabe</span><pre>${esc(r.output)}</pre>`;
  return `<div class="result ${r.passed ? "ok" : "bad"}" role="status">
    <h3>${r.passed ? "✓ Gelöst" : "✗ Noch nicht gelöst"}</h3><ul>${items}</ul>${extra}</div>`;
}

function renderTask() {
  const t = TASKS[state.cur], a = ans(t);
  const partTasks = TASKS.filter(x => x.part === t.part);
  let editors;
  if (t.files) {
    editors = t.files.map(f => `<label class="f" for="ed-${f}">${esc(f)}${f.endsWith("__init__.py") ? " (darf leer bleiben)" : ""}</label>
      <textarea id="ed-${f}" data-file="${esc(f)}" class="${f.endsWith("__init__.py") ? "small" : ""}" spellcheck="false" autocapitalize="off" autocomplete="off">${esc(a.code[f] || "")}</textarea>`).join("");
  } else {
    editors = `<label class="f" for="ed">Dein Code</label>
      <textarea id="ed" spellcheck="false" autocapitalize="off" autocomplete="off">${esc(a.code)}</textarea>`;
  }
  const sol = SOLUTIONS[t.id];
  const solText = typeof sol === "string" ? sol : Object.entries(sol).map(([f, c]) => `# ── ${f} ──\n${c}`).join("\n\n");
  document.getElementById("view").innerHTML = `
  <section class="card">
    <div class="meta">Aufgabe ${t.part} · ${esc(PARTS[t.part])} · Frage ${state.cur + 1} von ${TASKS.length}</div>
    <h2>${esc(t.id)} ${esc(t.title)}</h2>
    <p class="q">${md(t.text)}</p>
    ${t.given ? `<div class="box"><span>Vorgegeben</span><pre>${esc(t.given)}</pre></div>` : ""}
    ${t.expect ? `<div class="box"><span>Erwartet</span><pre>${esc(t.expect)}</pre></div>` : ""}
    ${editors}
    <div class="actions">
      <button class="btn primary" id="check" ${runtime.ready ? "" : "disabled"}>Prüfen</button>
      <span class="hint">Strg/⌘ + Enter</span>
      <span class="spacer"></span>
      <button class="btn ghost" id="peek">${a.showSol ? "Lösung ausblenden" : "Lösung zeigen"}</button>
      <button class="btn" id="prev" ${state.cur === 0 ? "disabled" : ""}>← Zurück</button>
      <button class="btn" id="next">${state.cur === TASKS.length - 1 ? "Auswertung →" : "Weiter →"}</button>
    </div>
    <div id="res">${resultHTML(a.last)}</div>
    <div class="solution box" ${a.showSol ? "" : "hidden"}><span>Musterlösung (eine von mehreren Möglichkeiten)</span><pre>${esc(solText)}</pre></div>
  </section>`;
  document.querySelectorAll("#view textarea").forEach(setupEditor);
}

function renderReport() {
  const counts = { passed: 0, failed: 0, open: 0 };
  TASKS.forEach(t => counts[ans(t).status]++);
  const pct = Math.round(100 * counts.passed / TASKS.length);
  let parts = "";
  for (const p of [1, 2, 3, 4]) {
    const ts = TASKS.filter(t => t.part === p);
    const ok = ts.filter(t => ans(t).status === "passed").length;
    parts += `<h4 class="part"><span>Aufgabe ${p} · ${esc(PARTS[p])}</span><span>${ok} / ${ts.length}</span></h4>
      <div class="bar"><i style="width:${100 * ok / ts.length}%"></i></div>
      <table class="rep">${ts.map(t => {
        const a = ans(t), i = TASKS.indexOf(t);
        const label = { passed: "gelöst", failed: "nicht gelöst", open: "offen" }[a.status];
        const info = [a.tries ? `${a.tries} Versuch${a.tries > 1 ? "e" : ""}` : "", a.peeked ? "Lösung angesehen" : ""].filter(Boolean).join(" · ");
        return `<tr><td><a href="#" data-go="${i}">${esc(t.id)} ${esc(t.title)}</a></td><td class="hint">${info}</td><td><span class="tag ${a.status}">${label}</span></td></tr>`;
      }).join("")}</table>`;
  }
  const firstOpen = TASKS.findIndex(t => ans(t).status !== "passed");
  document.getElementById("view").innerHTML = `
  <section class="card">
    <div class="meta">Auswertung</div>
    <div class="summary"><span class="big">${counts.passed} / ${TASKS.length}</span>
      <span>gelöst (${pct} %) · ${counts.failed} nicht gelöst · ${counts.open} offen</span></div>
    ${parts}
    <div class="actions">
      ${firstOpen >= 0 ? `<button class="btn primary" data-go="${firstOpen}">Nächste ungelöste Frage</button>` : ""}
      <button class="btn" data-go="${state.cur}">Zurück zu den Fragen</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="reset">Fortschritt zurücksetzen</button>
    </div>
  </section>`;
}

function render() {
  renderMap();
  state.view === "report" ? renderReport() : renderTask();
}

/* ---------------- Editor-Komfort ---------------- */
function setupEditor(ta) {
  const t = TASKS[state.cur];
  ta.addEventListener("input", () => {
    const a = ans(t);
    if (ta.dataset.file) a.code[ta.dataset.file] = ta.value; else a.code = ta.value;
    save();
  });
  ta.addEventListener("keydown", (e) => {
    const s = ta.selectionStart, en = ta.selectionEnd, v = ta.value;
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); doCheck(); return; }
    if (e.key === "Tab" && !e.shiftKey) {
      e.preventDefault();
      ta.setRangeText("    ", s, en, "end");
      ta.dispatchEvent(new Event("input"));
    } else if (e.key === "Tab" && e.shiftKey) {
      e.preventDefault();
      const ls = v.lastIndexOf("\n", s - 1) + 1;
      const n = (v.slice(ls).match(/^ {1,4}/) || [""])[0].length;
      if (n) { ta.setRangeText("", ls, ls + n, "preserve"); ta.selectionStart = ta.selectionEnd = Math.max(ls, s - n); ta.dispatchEvent(new Event("input")); }
    } else if (e.key === "Enter" && !e.shiftKey) {
      const ls = v.lastIndexOf("\n", s - 1) + 1;
      const line = v.slice(ls, s);
      let indent = line.match(/^\s*/)[0];
      if (/:\s*(#.*)?$/.test(line)) indent += "    ";
      e.preventDefault();
      ta.setRangeText("\n" + indent, s, en, "end");
      ta.dispatchEvent(new Event("input"));
    }
  });
}

/* ---------------- Aktionen ---------------- */
async function doCheck() {
  const btn = document.getElementById("check");
  if (!runtime.ready || !btn || btn.disabled) return;
  const idx = state.cur, t = TASKS[idx], a = ans(t);
  btn.disabled = true; btn.textContent = "Prüfe …";
  document.getElementById("res").innerHTML = "";
  const r = await runtime.grade(t.id, a.code);
  a.tries++; a.last = r;
  a.status = r.passed ? "passed" : "failed";
  save();
  if (state.view === "task" && state.cur === idx) {
    renderMap();
    document.getElementById("res").innerHTML = resultHTML(r);
    const b = document.getElementById("check");
    if (b) { b.disabled = !runtime.ready; b.textContent = "Prüfen"; }
  }
}

document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go) { e.preventDefault(); state.cur = +go.dataset.go; state.view = "task"; save(); render(); window.scrollTo(0, 0); return; }
  if (e.target.closest("[data-report]")) { state.view = "report"; save(); render(); return; }
  const id = e.target.id;
  if (id === "check") doCheck();
  else if (id === "prev") { state.cur--; save(); render(); }
  else if (id === "next") {
    if (state.cur === TASKS.length - 1) state.view = "report"; else state.cur++;
    save(); render(); window.scrollTo(0, 0);
  }
  else if (id === "peek") {
    const a = ans(TASKS[state.cur]);
    a.showSol = !a.showSol; if (a.showSol) a.peeked = true;
    save(); render();
  }
  else if (id === "reset") {
    if (confirm("Alle Eingaben und Ergebnisse löschen?")) { state = { cur: 0, view: "task", answers: {} }; save(); render(); }
  }
});

render();
runtime.start();
</script>
